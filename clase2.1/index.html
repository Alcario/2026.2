<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="author" content="CAMINOS, Albano">
    <title>Login</title>
</head>
<style>
    li{
        list-style: none;
        list-style-type: '\1F600';
    }
    div{
        width: 50%;
        height: 15px;
        background-color: red;
    }
</style>
<body>
    <header>
        <h1 style="color: orange; text-align: center; font-size: 100px;">Iniciar sesión</h1>
        <hr>
    </header>
    <main>
        <section>
            <h2>Últimos usuarios logeados:</h2>
            <ul>
                <li>Lorem, ipsum.</li>
                <li>Amet, eligendi.</li>
                <li>Repellat, quidem.</li>
            </ul>
        </section>
        <section style="background-color: aqua; width: 33vw;">
            <div></div>
            <h2 style="color: blue; font-family: 'Roboto'; letter-spacing: 3px;">Bienvenido, Ingrese sus datos:</h2>
            <form action="" style="display: flex; flex-direction: column; align-items: center;">
                <label for="username" style="margin-bottom: 20px;">
                    <!--
                    tags: [account, avatar, profile, role]
                    version: "1.44"
                    unicode: "ef68"
                    category: System
                    -->
                    <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="40"
                    height="40"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#007aff"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    >
                    <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
                    <path d="M12 10m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
                    <path d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855" />
                    </svg>
                    <input type="text" placeholder="usuario" id="username" required>
                </label>
                <label for="password">
                    <!--
                    tags: [shape, lock, door, acsses]
                    unicode: "f633"
                    version: "1.117"
                    -->
                    <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="40"
                    height="40"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#007aff"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    >
                    <path d="M14 10m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                    <path d="M21 12a9 9 0 1 1 -18 0a9 9 0 0 1 18 0z" />
                    <path d="M12.5 11.5l-4 4l1.5 1.5" />
                    <path d="M12 15l-1.5 -1.5" />
                    </svg>
                    <input type="password" name="password" id="password" required>
                </label>
                <br>
                <label for="record">
                    <input type="checkbox" name="record" id="record">
                    Recordar cuenta
                </label>
                <br>
                <input type="button" value="Ingresar">
            </form>
            
            
        </section>
    </main>
</body>
</html>
