<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones</title>
</head>
<body>
    <script>
        //Ejercicio 1
        function suma(a, b){
            let suma = a + b;

            return suma;
        }

        function resta(a, b){
            return a-b;
        }

        function multiplicar(a, b){
            return a*b;
        }

        function dividir(a, b){
            if(b === 0){
                return "No se puede dividir por cero";
            }

            return a/b;
        }

        let a = parseInt(prompt("Ingrese un valor:"));
        let b = parseInt(prompt("Ingrese otro valor:"));

        console.log(a + " + ", b, " = ", suma(a,b));
        console.log(a + " - ", b, " = ", resta(a,b));
        console.log(a + " / ", b, " = ", dividir(a,b));
        console.log(a + " * ", b, " = ", multiplicar(a,b));
    </script>
</body>
</html>
