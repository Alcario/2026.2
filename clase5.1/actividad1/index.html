<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let peliculaFavorita = prompt("Ingrese el nombre de su película favorita: ");
        let personajeFavorito = prompt("Ingrese el nombre del personaje favorito: ");

        document.write("<h1>Mi Peli Favorita</h1>");
        document.write("<p>El nombre de mi película favorita es: " + peliculaFavorita + "</p>");
        document.write("<p>Además el nombre de mi personaje favorito es: " + personajeFavorito + "</p>");
    </script>
</body>
</html>
