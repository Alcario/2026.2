<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructuras repetitivas</title>
</head>
<body>
    <script>
        console.log("1");
        console.log("2");
        console.log("3");
        console.log("4");
        console.log("5");
        console.log("6");
        console.log("7");
        console.log("8");
        console.log("9");
        console.log("10");

        let contador = 11;

        while(contador<=20){
            console.log(contador);
            contador = contador + 1;
        }

        contador = 21

        do{
            console.log(contador);
            contador = contador + 1;
        }while(contador<31);

        for(contador=31; contador<=100000; contador++){
            console.log(contador);
        }
    </script>
</body>
</html>
