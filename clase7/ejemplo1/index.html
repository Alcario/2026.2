<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicionales - Switch case</title>
</head>
<body>
    <script>
        let dia = parseInt(prompt("Ingrese un valor entre 1 y 5 para saber qué días quedan hasta el viernes:"));

        switch(dia){
            case 1:
                console.log("Lunes");
            
            case 2:
                console.log("Martes");

            case 3:
                console.log("Miércoles");
            
            case 4:
                console.log("Jueves");
            
            case 5:
                console.log("Viernes");
                break;
            
            default:
                console.log("Valor no reconocido");
        }
    </script>
</body>
</html>
